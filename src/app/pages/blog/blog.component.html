<div class="container">
    <h3 class="subtitle">Últimas Noticias</h3>
    <div class="boxes">
        <div class="row vertical-line">
            <div
                *ngFor="let post of posts"
                class="col-md-6"
            >
                <a href="javascript:void(0)" class="blog-box" (click)="openPost(post)">
                    <div class="blog-image">
                        <img [src]="post.previewImg" [alt]="post.title" />
                        <div class="blog-icon">
                            <i class="bi bi-calendar-check"></i>
                            {{ post.date }}
                        </div>
                    </div>
                    <div class="blog-post-content">
                        <div class="blog-dates">
                            <a>{{ post.category }}</a>
                        </div>
                        <h6 class="blog-header">{{ post.title }}</h6>
                        <p class="mb-0">{{ post.body | slice:0:120 }}...</p>
                    </div>
                </a>
            </div>
        </div>
    </div>
</div>
